name: Generate Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tag]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        run: |
          git fetch --tags
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)

          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            version="${latest#v}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            new="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Nova tag: $new"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$new"
          git push origin "$new"
